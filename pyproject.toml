[build-system]
requires = ["setuptools>=69", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "sregnas"
version = "1.0.0"
description = "SREGNAS: reproducibility artifact, November 6 result freeze"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.5.1", "torch-geometric==2.7.0", "torch-scatter==2.1.2",
  "torch-sparse==0.6.18", "ogb==1.3.6", "numpy==2.4.4",
  "scipy==1.17.1", "PyYAML==6.0.3", "numba==0.65.0", "psutil==7.2.2",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]
baseline = ["ray==2.47.1", "pandas==3.0.2", "matplotlib==3.10.8"]

[project.scripts]
sregnas = "sregnas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sregnas = ["resources/*.json", "resources/*.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["unit: CPU tests using synthetic inputs"]
addopts = "-p no:cacheprovider"
